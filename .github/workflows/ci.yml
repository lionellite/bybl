name: CI

on:
  push:
    branches: ["master", "audit-and-hardening"]
  pull_request:

permissions:
  contents: read

jobs:
  sqlite:
    name: Tests SQLite / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key-with-more-than-fifty-characters-123456789
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost
      DJANGO_SECURE_SSL_REDIRECT: "True"
      DJANGO_HSTS_SECONDS: "31536000"
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt
      - name: Vérifier Django
        run: |
          python manage.py check
          python manage.py check --deploy
          python manage.py makemigrations --check --dry-run
      - name: Exécuter les tests
        run: python manage.py test -v 2
      - name: Vérifier la compilation
        run: python -m compileall -q api bible bybl manage.py

  postgres:
    name: Tests PostgreSQL / Python 3.12
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bybl
          POSTGRES_USER: bybl
          POSTGRES_PASSWORD: bybl-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key-with-more-than-fifty-characters-123456789
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost
      DJANGO_SECURE_SSL_REDIRECT: "True"
      DJANGO_HSTS_SECONDS: "31536000"
      DJANGO_DB_ENGINE: postgresql
      POSTGRES_DB: bybl
      POSTGRES_USER: bybl
      POSTGRES_PASSWORD: bybl-ci-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt
      - name: Vérifier les migrations PostgreSQL
        run: python manage.py migrate --noinput
      - name: Vérifier Django
        run: |
          python manage.py check
          python manage.py check --deploy
          python manage.py makemigrations --check --dry-run
      - name: Exécuter les tests
        run: python manage.py test -v 2
