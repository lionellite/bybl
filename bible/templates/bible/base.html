{% load static %}
<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Lire et rechercher la Bible en ligne.">
    <title>{% block title %}Bible en ligne{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'bible/style.css' %}">
</head>
<body>
<header class="site-header">
    <div class="header-inner">
        <h1><a href="{% url 'home' %}">Bible en ligne</a></h1>
        <form class="search-form" action="{% url 'search' %}" method="get" role="search">
            <label class="sr-only" for="site-search">Rechercher dans le texte biblique</label>
            <input id="site-search" type="search" name="q" maxlength="100" placeholder="Rechercher…" value="{{ query|default:'' }}">
            <button type="submit">Rechercher</button>
        </form>
    </div>
</header>
<main class="container">
{% block content %}{% endblock %}
</main>
</body>
</html>
